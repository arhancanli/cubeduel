name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · tests · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the production runtime.
          node-version: 24
          cache: npm

      - run: npm ci

      # Route and page prop types are generated, not committed, so a new route
      # fails typecheck until this has run.
      - name: Generate route types
        run: npx next typegen

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # No credentials at all, deliberately.
      #
      # The build must not need any. Every database-backed page degrades to an
      # honest "not configured" state without them, and this job is what keeps
      # that true — if a page ever starts requiring a key at build time, it
      # breaks here rather than in production.
      #
      # This used to need two placeholder Clerk keys, one of which had to be a
      # well-formed base64 payload because the SDK decoded a hostname out of it
      # at build time. Identity is ours now and nothing is decoded at build.
      - name: Build
        run: npm run build

      # Two invariants that fail silently in the app itself:
      #   - future daily scrambles must NOT reach the client bundle
      #   - the startup scramble pool MUST reach it
      - name: Bundle invariants
        run: npm run check:bundle

      # The claims the repository makes about itself: every internal link has a
      # page, every fetched API path has a route, every analytics event has an
      # emitter, every path the docs name exists, every suite is wired up, and
      # the counts in the README are the counts the runner reports.
      #
      # All six were wrong at some point while everything above this step
      # passed — `/forgot`, `/reset` and `/verify` were linked from two emails
      # and did not exist, which made password reset a feature that lived only
      # in a test. Nothing here is a type error, so nothing else can catch it.
      - name: Audit the repository's own claims
        run: npm run audit
